name: CI efficacy audit

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-efficacy-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: |
          echo "GOCACHE=$RUNNER_TEMP/v1-owned/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/v1-owned/go-mod" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/v1-owned/go-build" "$RUNNER_TEMP/v1-owned/go-mod"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build native controller and validate authority
        run: |
          cd audit/go-engine
          go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
          "$RUNNER_TEMP/endstate-validation-pilot" validate-v1 --root "$GITHUB_WORKSPACE/audit" --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Bootstrap exact dispatch source anonymously
        shell: pwsh
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$env:GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          if ((git -C audit rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'dispatch mismatch' }
      - name: Prepare shared Go cache roots
        shell: pwsh
        run: |
          "GOCACHE=$env:RUNNER_TEMP/v1-owned/go-build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOMODCACHE=$env:RUNNER_TEMP/v1-owned/go-mod" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/v1-owned/go-build", "$env:RUNNER_TEMP/v1-owned/go-mod" | Out-Null
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build and run native Windows controller
        shell: pwsh
        run: |
          $repositoryRoot = Join-Path $env:GITHUB_WORKSPACE 'audit'
          $manifestPath = Join-Path $repositoryRoot 'validation\ci-efficacy\pilot-v1\manifest.json'
          $runnerRoot = Join-Path $env:RUNNER_TEMP 'v1-owned'
          $goCache = Join-Path $runnerRoot 'go-build'
          $goModCache = Join-Path $runnerRoot 'go-mod'
          $resultRoot = Join-Path $runnerRoot 'results'
          $controller = Join-Path $env:RUNNER_TEMP 'endstate-validation-pilot.exe'
          Push-Location (Join-Path $repositoryRoot 'go-engine')
          go build -buildvcs=false -o $controller ./cmd/endstate-validation-pilot
          Pop-Location
          & $controller run-v1-lane --root $repositoryRoot --manifest $manifestPath --dispatch-commit "$env:GITHUB_SHA" --role comparator --lane windows-go --runner-root $runnerRoot --runner-family windows --runner-image-os "$env:ImageOS" --runner-image-version "$env:ImageVersion" --go-cache $goCache --go-mod-cache $goModCache --result-root $resultRoot
          & $controller run-v1-lane --root $repositoryRoot --manifest $manifestPath --dispatch-commit "$env:GITHUB_SHA" --role baseline --lane windows-detector --runner-root $runnerRoot --runner-family windows --runner-image-os "$env:ImageOS" --runner-image-version "$env:ImageVersion" --go-cache $goCache --go-mod-cache $goModCache --result-root $resultRoot
          & $controller run-v1-lane --root $repositoryRoot --manifest $manifestPath --dispatch-commit "$env:GITHUB_SHA" --role detector --lane windows-detector --runner-root $runnerRoot --runner-family windows --runner-image-os "$env:ImageOS" --runner-image-version "$env:ImageVersion" --go-cache $goCache --go-mod-cache $goModCache --result-root $resultRoot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-windows
          path: ${{ runner.temp }}/v1-owned/results
          retention-days: 7
          if-no-files-found: error

  ubuntu:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: |
          echo "GOCACHE=$RUNNER_TEMP/v1-owned/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/v1-owned/go-mod" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/v1-owned/go-build" "$RUNNER_TEMP/v1-owned/go-mod"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build and run native Ubuntu controller
        run: |
          cd audit/go-engine
          go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
          "$RUNNER_TEMP/endstate-validation-pilot" run-v1-lane --root "$GITHUB_WORKSPACE/audit" --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA" --role comparator --lane ubuntu-go --runner-root "$RUNNER_TEMP/v1-owned" --runner-family linux --runner-image-os "$ImageOS" --runner-image-version "$ImageVersion" --go-cache "$GOCACHE" --go-mod-cache "$GOMODCACHE" --result-root "$RUNNER_TEMP/v1-owned/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-ubuntu
          path: ${{ runner.temp }}/v1-owned/results
          retention-days: 7
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: |
          echo "GOCACHE=$RUNNER_TEMP/v1-owned/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/v1-owned/go-mod" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/v1-owned/go-build" "$RUNNER_TEMP/v1-owned/go-mod"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build and run native macOS controller
        run: |
          cd audit/go-engine
          go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
          "$RUNNER_TEMP/endstate-validation-pilot" run-v1-lane --root "$GITHUB_WORKSPACE/audit" --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA" --role comparator --lane macos-go --runner-root "$RUNNER_TEMP/v1-owned" --runner-family darwin --runner-image-os "$ImageOS" --runner-image-version "$ImageVersion" --go-cache "$GOCACHE" --go-mod-cache "$GOMODCACHE" --result-root "$RUNNER_TEMP/v1-owned/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-macos
          path: ${{ runner.temp }}/v1-owned/results
          retention-days: 7
          if-no-files-found: error

  aggregate:
    needs: [windows, ubuntu, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: |
          echo "GOCACHE=$RUNNER_TEMP/v1-owned/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/v1-owned/go-mod" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/v1-owned/go-build" "$RUNNER_TEMP/v1-owned/go-mod"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build native controller
        run: cd audit/go-engine && go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: v1-*
          path: evidence
          merge-multiple: true
      - name: Aggregate fixed typed inventory
        run: |
          mkdir -p "$RUNNER_TEMP/v1-aggregate"
          "$RUNNER_TEMP/endstate-validation-pilot" aggregate-v1 --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA" --evidence-root "$GITHUB_WORKSPACE/evidence" --output "$RUNNER_TEMP/v1-aggregate/aggregate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-aggregate
          path: ${{ runner.temp }}/v1-aggregate
          retention-days: 7
          if-no-files-found: error
