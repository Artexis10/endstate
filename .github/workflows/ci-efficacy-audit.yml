name: CI efficacy audit

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-efficacy-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ runner.temp }}/v1-owned/go-build
      GOMODCACHE: ${{ runner.temp }}/v1-owned/go-mod
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: mkdir -p "$GOCACHE" "$GOMODCACHE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build native controller and validate authority
        run: |
          cd audit/go-engine
          go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
          "$RUNNER_TEMP/endstate-validation-pilot" validate-v1 --root "$GITHUB_WORKSPACE/audit" --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      GOCACHE: ${{ runner.temp }}/v1-owned/go-build
      GOMODCACHE: ${{ runner.temp }}/v1-owned/go-mod
    steps:
      - name: Bootstrap exact dispatch source anonymously
        shell: pwsh
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$env:GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          if ((git -C audit rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'dispatch mismatch' }
      - name: Prepare shared Go cache roots
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:GOCACHE, $env:GOMODCACHE | Out-Null
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build and run native Windows controller
        shell: pwsh
        run: |
          Push-Location audit/go-engine
          go build -buildvcs=false -o "$env:RUNNER_TEMP/endstate-validation-pilot.exe" ./cmd/endstate-validation-pilot
          Pop-Location
          & "$env:RUNNER_TEMP/endstate-validation-pilot.exe" run-v1-lane --root "$env:GITHUB_WORKSPACE/audit" --manifest "$env:GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$env:GITHUB_SHA" --role comparator --lane windows-go --runner-root "$env:RUNNER_TEMP/v1-owned" --runner-family windows --runner-image-os "$env:ImageOS" --runner-image-version "$env:ImageVersion" --go-cache "$env:GOCACHE" --go-mod-cache "$env:GOMODCACHE" --result-root "$env:RUNNER_TEMP/v1-owned/results"
          & "$env:RUNNER_TEMP/endstate-validation-pilot.exe" run-v1-lane --root "$env:GITHUB_WORKSPACE/audit" --manifest "$env:GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$env:GITHUB_SHA" --role baseline --lane windows-detector --runner-root "$env:RUNNER_TEMP/v1-owned" --runner-family windows --runner-image-os "$env:ImageOS" --runner-image-version "$env:ImageVersion" --go-cache "$env:GOCACHE" --go-mod-cache "$env:GOMODCACHE" --result-root "$env:RUNNER_TEMP/v1-owned/results"
          & "$env:RUNNER_TEMP/endstate-validation-pilot.exe" run-v1-lane --root "$env:GITHUB_WORKSPACE/audit" --manifest "$env:GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$env:GITHUB_SHA" --role detector --lane windows-detector --runner-root "$env:RUNNER_TEMP/v1-owned" --runner-family windows --runner-image-os "$env:ImageOS" --runner-image-version "$env:ImageVersion" --go-cache "$env:GOCACHE" --go-mod-cache "$env:GOMODCACHE" --result-root "$env:RUNNER_TEMP/v1-owned/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-windows
          path: ${{ runner.temp }}/v1-owned/results
          retention-days: 7
          if-no-files-found: error

  ubuntu:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOCACHE: ${{ runner.temp }}/v1-owned/go-build
      GOMODCACHE: ${{ runner.temp }}/v1-owned/go-mod
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: mkdir -p "$GOCACHE" "$GOMODCACHE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build and run native Ubuntu controller
        run: |
          cd audit/go-engine
          go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
          "$RUNNER_TEMP/endstate-validation-pilot" run-v1-lane --root "$GITHUB_WORKSPACE/audit" --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA" --role comparator --lane ubuntu-go --runner-root "$RUNNER_TEMP/v1-owned" --runner-family linux --runner-image-os "$ImageOS" --runner-image-version "$ImageVersion" --go-cache "$GOCACHE" --go-mod-cache "$GOMODCACHE" --result-root "$RUNNER_TEMP/v1-owned/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-ubuntu
          path: ${{ runner.temp }}/v1-owned/results
          retention-days: 7
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GOCACHE: ${{ runner.temp }}/v1-owned/go-build
      GOMODCACHE: ${{ runner.temp }}/v1-owned/go-mod
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: mkdir -p "$GOCACHE" "$GOMODCACHE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build and run native macOS controller
        run: |
          cd audit/go-engine
          go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
          "$RUNNER_TEMP/endstate-validation-pilot" run-v1-lane --root "$GITHUB_WORKSPACE/audit" --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA" --role comparator --lane macos-go --runner-root "$RUNNER_TEMP/v1-owned" --runner-family darwin --runner-image-os "$ImageOS" --runner-image-version "$ImageVersion" --go-cache "$GOCACHE" --go-mod-cache "$GOMODCACHE" --result-root "$RUNNER_TEMP/v1-owned/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-macos
          path: ${{ runner.temp }}/v1-owned/results
          retention-days: 7
          if-no-files-found: error

  aggregate:
    needs: [windows, ubuntu, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ runner.temp }}/v1-owned/go-build
      GOMODCACHE: ${{ runner.temp }}/v1-owned/go-mod
    steps:
      - name: Bootstrap exact dispatch source anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch https://github.com/Artexis10/endstate.git "$GITHUB_SHA"
          git -C audit checkout --detach FETCH_HEAD
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare shared Go cache roots
        run: mkdir -p "$GOCACHE" "$GOMODCACHE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: audit/go-engine/go.sum
      - name: Build native controller
        run: cd audit/go-engine && go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: v1-*
          path: evidence
          merge-multiple: true
      - name: Aggregate fixed typed inventory
        run: |
          mkdir -p "$RUNNER_TEMP/v1-aggregate"
          "$RUNNER_TEMP/endstate-validation-pilot" aggregate-v1 --manifest "$GITHUB_WORKSPACE/audit/validation/ci-efficacy/pilot-v1/manifest.json" --dispatch-commit "$GITHUB_SHA" --evidence-root "$GITHUB_WORKSPACE/evidence" --output "$RUNNER_TEMP/v1-aggregate/aggregate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-aggregate
          path: ${{ runner.temp }}/v1-aggregate
          retention-days: 7
          if-no-files-found: error
