name: CI efficacy audit
on:
  workflow_dispatch:
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire audit runner anonymously
        run: |
          git -c credential.helper= -c http.extraheader= init audit
          git -C audit -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/Artexis10/endstate.git $GITHUB_SHA
          git -C audit checkout --detach $GITHUB_SHA
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate corpus and build runner
        run: |
          go version | grep 'go1.26'
          cd audit/go-engine
          go build -buildvcs=false -o "$RUNNER_TEMP/endstate-validation-pilot" ./cmd/endstate-validation-pilot
          "$RUNNER_TEMP/endstate-validation-pilot" validate-corpus "$GITHUB_WORKSPACE/audit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: efficacy-audit-kit, path: audit, retention-days: 7, if-no-files-found: error }
  baseline:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: { name: efficacy-audit-kit, path: audit }
      - name: Acquire exact detector authority anonymously
        shell: pwsh
        run: |
          git -c credential.helper= -c http.extraheader= init detector
          git -C detector -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/Artexis10/endstate.git 437c0ca4167c09bc9f2de515daa6d55d35257d4f
          git -C detector checkout --detach 437c0ca4167c09bc9f2de515daa6d55d35257d4f
          if ((git -C detector rev-parse HEAD) -ne '437c0ca4167c09bc9f2de515daa6d55d35257d4f') { throw 'detector ref mismatch' }
      - name: Run bound detector baseline twice
        shell: pwsh
        run: |
          if (-not ((go version) -match 'go1\.26')) { throw 'Go 1.26 is required' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/endstate-validation-results" | Out-Null
          Push-Location detector/go-engine
          go build -o $env:RUNNER_TEMP/endstate.exe ./cmd/endstate
          go build -o $env:RUNNER_TEMP/endstate-validation.exe ./cmd/endstate-validation
          1..2 | ForEach-Object {
            & $env:RUNNER_TEMP/endstate-validation.exe catalog --engine $env:RUNNER_TEMP/endstate.exe --repo (Resolve-Path ..) --commit 437c0ca4167c09bc9f2de515daa6d55d35257d4f --result "$env:RUNNER_TEMP/endstate-validation-results/catalog-$_.json"
            & $env:RUNNER_TEMP/endstate-validation.exe --engine $env:RUNNER_TEMP/endstate.exe --repo (Resolve-Path ..) --module apps.vlc --scenario default-v1 --result "$env:RUNNER_TEMP/endstate-validation-results/vlc-$_.json"
            & $env:RUNNER_TEMP/endstate-validation.exe --engine $env:RUNNER_TEMP/endstate.exe --repo (Resolve-Path ..) --module apps.alacritty --scenario default-v1 --result "$env:RUNNER_TEMP/endstate-validation-results/alacritty-$_.json"
            & $env:RUNNER_TEMP/endstate-validation.exe --engine $env:RUNNER_TEMP/endstate.exe --repo (Resolve-Path ..) --module apps.obs-studio --scenario default-v1 --result "$env:RUNNER_TEMP/endstate-validation-results/obs-$_.json"
          }
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: efficacy-baseline, path: ${{ runner.temp }}/endstate-validation-results, retention-days: 7, if-no-files-found: warn }
  candidate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        id: [bundle-duplicate, bundle-missing, bundle-id-drift, vlc-backup-off, alacritty-source-drift, obs-target-drift]
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: { name: efficacy-audit-kit, path: audit }
      - name: Acquire and mutate exact legacy authority anonymously
        shell: bash
        run: |
          set -u
          git -c credential.helper= -c http.extraheader= init legacy
          git -C legacy -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/Artexis10/endstate.git ab8065cd67ab3f4e9e876e07a25facf3100c28c7
          git -C legacy checkout --detach ab8065cd67ab3f4e9e876e07a25facf3100c28c7
          test "$(git -C legacy rev-parse HEAD)" = ab8065cd67ab3f4e9e876e07a25facf3100c28c7
          git -C legacy apply --check "../audit/validation/ci-efficacy/pilot-v0/patches/${{ matrix.id }}/legacy.patch"
          git -C legacy apply "../audit/validation/ci-efficacy/pilot-v0/patches/${{ matrix.id }}/legacy.patch"
      - name: Run legacy merge-gate contract
        shell: pwsh
        working-directory: legacy/go-engine
        run: |
          go vet ./...
          go test ./...
          if ('${{ matrix.os }}' -eq 'windows-latest') {
            if (-not (Test-Path "$env:ProgramFiles\Notepad++\notepad++.exe")) { throw 'infrastructure: Notepad++ is absent' }
            go build -o $env:RUNNER_TEMP/endstate.exe ./cmd/endstate
            & ../scripts/integration-test.ps1
          }
      - name: Run two fresh patched detector attempts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/endstate-validation-results" | Out-Null
          1..2 | ForEach-Object {
            git -c credential.helper= -c http.extraheader= init "detector-$_"
            git -C "detector-$_" -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/Artexis10/endstate.git 437c0ca4167c09bc9f2de515daa6d55d35257d4f
            git -C "detector-$_" checkout --detach 437c0ca4167c09bc9f2de515daa6d55d35257d4f
            git -C "detector-$_" apply --check "audit/validation/ci-efficacy/pilot-v0/patches/${{ matrix.id }}/detector.patch"
            git -C "detector-$_" apply "audit/validation/ci-efficacy/pilot-v0/patches/${{ matrix.id }}/detector.patch"
            Push-Location "detector-$_/go-engine"
            go build -o $env:RUNNER_TEMP/endstate.exe ./cmd/endstate
            go build -o $env:RUNNER_TEMP/endstate-validation.exe ./cmd/endstate-validation
            if ('${{ matrix.id }}' -like 'bundle-*') { & $env:RUNNER_TEMP/endstate-validation.exe catalog --engine $env:RUNNER_TEMP/endstate.exe --repo (Resolve-Path ..) --commit 437c0ca4167c09bc9f2de515daa6d55d35257d4f --result "$env:RUNNER_TEMP/endstate-validation-results/detector-$_.json" } else { $module = 'apps.' + ('${{ matrix.id }}' -replace '-(backup-off|source-drift|target-drift)$',''); & $env:RUNNER_TEMP/endstate-validation.exe --engine $env:RUNNER_TEMP/endstate.exe --repo (Resolve-Path ..) --module $module --scenario default-v1 --result "$env:RUNNER_TEMP/endstate-validation-results/detector-$_.json" }
            Pop-Location
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: efficacy-${{ matrix.id }}-${{ matrix.os }}, path: ${{ runner.temp }}/endstate-validation-results, retention-days: 7, if-no-files-found: warn }
  aggregate:
    needs: [baseline, candidate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: { pattern: efficacy-*, path: evidence, merge-multiple: false }
      - name: Verify fixed evidence inventory
        run: test "$(find evidence -mindepth 1 -maxdepth 1 -type d -name 'efficacy-*' | wc -l)" -eq 19
      - name: Write six-row decision summary
        run: |
          echo '## CI efficacy audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'Aggregate reads only the nineteen bounded evidence artifacts.' >> "$GITHUB_STEP_SUMMARY"
