name: Go Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Keep this exact stable check name: branch protection may require it.
    name: Go Tests
    needs: [nix-catalog-evaluation, linux-no-nix-capture]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Require pinned mapping evaluation on both Linux architectures
        if: ${{ needs.nix-catalog-evaluation.result != 'success' }}
        shell: pwsh
        run: exit 1
      - name: Require Linux capture on a machine without Nix
        if: ${{ needs.linux-no-nix-capture.result != 'success' }}
        shell: pwsh
        run: exit 1
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Go
        # v6.0.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: go-engine/go.sum
      - name: Vet
        run: cd go-engine && go vet ./...
      - name: Test
        shell: pwsh
        run: |
          cd go-engine
          $harness = 'github.com/Artexis10/endstate/go-engine/internal/validationharness'
          $allPackages = @(go list ./...)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @($allPackages | Where-Object { $_ -ne $harness })
          go test -timeout 8m @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The harness repeatedly hashes the repository boundary. Run it alone
          # so concurrent package I/O cannot starve its Windows safety checks.
          $freshEnginePattern = '^TestRunFreshBuiltEngine'
          go test -timeout 3m ./internal/validationharness -skip $freshEnginePattern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Each real-engine case gets an independent package deadline in
          # addition to the child engine command's stricter sidecar deadline.
          $freshEngineTests = @(
            'TestRunFreshBuiltEngineReviewedMultiFileCaptureContracts',
            'TestRunFreshBuiltEngineTrackedGitDefaultV1AvoidsRawHarnessIO',
            'TestRunFreshBuiltEngineTrackedNotepadDefaultV1',
            'TestRunFreshBuiltEngineTrackedSchemaV1FileMerges',
            'TestRunFreshBuiltEngineRegistryRoundtrips',
            'TestRunFreshBuiltEngineTrackedKubectlInstallV1',
            'TestRunFreshBuiltEngineTrackedMGBACaptureV1',
            'TestRunFreshBuiltEngineTrackedRestoreContractV1',
            'TestRunFreshBuiltEngineTrackedSchemaV2'
          )
          foreach ($test in $freshEngineTests) {
            go test -timeout 3m ./internal/validationharness -run ('^' + $test + '$')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  nix-catalog-evaluation:
    name: Nix Catalog (${{ matrix.system }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          github-token: ''
          diagnostic-endpoint: ''
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: go-engine/go.sum
      - name: Evaluate every advertised target at the release revision
        working-directory: go-engine
        run: go run ./cmd/endstate-validation nix-mappings --repo "$GITHUB_WORKSPACE" --system '${{ matrix.system }}' > "$RUNNER_TEMP/nix-catalog.json"
      - name: Upload mapping evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-catalog-${{ matrix.system }}
          path: ${{ runner.temp }}/nix-catalog.json
          if-no-files-found: ignore
          retention-days: 7

  linux-no-nix-capture:
    # Required through the stable Go Tests job. It runs the built binary on a host
    # with no Nix executable and no Endstate state, as a new user would.
    name: Linux No-Nix Capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Go
        # v6.0.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: go-engine/go.sum
      - name: Require a runner without Nix
        run: |
          if command -v nix >/dev/null 2>&1; then
            echo "::error::nix is on PATH, so this job cannot prove capture without Nix"
            exit 1
          fi
          if [ -e "$HOME/.nix-profile" ]; then
            echo "::error::$HOME/.nix-profile exists, so this job cannot prove capture without Nix"
            exit 1
          fi
      - name: Build the engine inside the workspace
        # The binary finds the package catalog through the repository marker, as in a checkout.
        working-directory: go-engine
        run: go build -o bin/endstate ./cmd/endstate
      - name: Capture with a fresh home and no ENDSTATE_ROOT
        run: |
          fresh="$RUNNER_TEMP/fresh-home"
          mkdir -p "$fresh/.config" "$fresh/.local/share" "$fresh/.local/state" "$fresh/.cache"
          artifact="$RUNNER_TEMP/no-nix.endstate"
          result="$RUNNER_TEMP/no-nix-capture.json"
          status=0
          env -u ENDSTATE_ROOT HOME="$fresh" XDG_CONFIG_HOME="$fresh/.config" \
            XDG_DATA_HOME="$fresh/.local/share" XDG_STATE_HOME="$fresh/.local/state" \
            XDG_CACHE_HOME="$fresh/.cache" \
            "$GITHUB_WORKSPACE/go-engine/bin/endstate" capture --out "$artifact" --json > "$result" || status=$?
          if ! jq -e --arg artifact "$artifact" '
            def state($id): [.data.discovery.sources[]? | select(.id == $id) | .state] | first;
            .success == true and .error == null
            and state("nix-user-profile") == "not_available"
            and state("endstate-profile") == "not_available"
            and state("debian-explicit") == "succeeded"
            and .data.outputPath == $artifact
          ' "$result" > /dev/null; then
            echo "::error::capture exited $status and its JSON failed the no-Nix assertions"
            jq '{success, error, sources: [.data.discovery.sources[]? | {id, state}]}' "$result" || cat "$result"
            exit 1
          fi
          if [ ! -s "$artifact" ]; then
            echo "::error::capture reported success but wrote no artifact at $artifact"
            exit 1
          fi
      - name: Upload capture evidence
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-no-nix-capture
          path: ${{ runner.temp }}/no-nix-capture.json
          if-no-files-found: ignore
          retention-days: 7

  build-windows:
    name: Build Validation Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Go
        # v6.0.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: go-engine/go.sum
      - name: Build engine and validation binaries once
        run: |
          cd go-engine
          go build -o endstate.exe ./cmd/endstate
          go build -o endstate-validation.exe ./cmd/endstate-validation
      - name: Upload built binaries
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: endstate-windows-binaries
          path: |
            go-engine/endstate.exe
            go-engine/endstate-validation.exe
          retention-days: 1

  integration-windows:
    name: Integration Test (windows)
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download built engine
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: endstate-windows-binaries
          path: go-engine
      - name: Run integration test
        shell: pwsh
        run: cd go-engine && ./integration-test.ps1

  synthetic-shards:
    name: Synthetic Shard ${{ matrix.shard }}
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download built binaries
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: endstate-windows-binaries
          path: ${{ runner.temp }}/endstate-bin
      - name: Run synthetic shard
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $engine = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate.exe'
          $validator = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate-validation.exe'
          $resultRoot = Join-Path $env:RUNNER_TEMP 'endstate-validation-results'
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          & $validator shard --engine $engine --repo $env:GITHUB_WORKSPACE --commit $env:GITHUB_SHA --shards 8 --shard ${{ matrix.shard }} --result (Join-Path $resultRoot 'shard-${{ matrix.shard }}.json')
          exit $LASTEXITCODE
      - name: Upload shard evidence
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/endstate-validation-results/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  catalog-matrix:
    name: Catalog Matrix
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download built binaries
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: endstate-windows-binaries
          path: ${{ runner.temp }}/endstate-bin
      - name: Run all-bundle-twice catalog matrix
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $engine = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate.exe'
          $validator = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate-validation.exe'
          $resultRoot = Join-Path $env:RUNNER_TEMP 'endstate-validation-results'
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          & $validator catalog --engine $engine --repo $env:GITHUB_WORKSPACE --commit $env:GITHUB_SHA --result (Join-Path $resultRoot 'catalog.json')
          exit $LASTEXITCODE
      - name: Upload catalog evidence
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-matrix
          path: ${{ runner.temp }}/endstate-validation-results/catalog.json
          if-no-files-found: error
          retention-days: 7

  notepad-engine-contract:
    name: Notepad++ Synthetic Engine Contract
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download built binaries
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: endstate-windows-binaries
          path: ${{ runner.temp }}/endstate-bin
      - name: Run synthetic Notepad++ engine-contract canary
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $engine = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate.exe'
          $validator = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate-validation.exe'
          $resultRoot = Join-Path $env:RUNNER_TEMP 'endstate-validation-results'
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          & $validator canary --engine $engine --repo $env:GITHUB_WORKSPACE --commit $env:GITHUB_SHA --result (Join-Path $resultRoot 'canary.json')
          exit $LASTEXITCODE
      - name: Upload synthetic canary evidence
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notepad-engine-contract
          path: ${{ runner.temp }}/endstate-validation-results/canary.json
          if-no-files-found: error
          retention-days: 7

  verified-module-matrix:
    name: Verified Module Matrix
    if: always()
    needs: [build-windows, synthetic-shards, catalog-matrix, notepad-engine-contract]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download built binaries
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: endstate-windows-binaries
          path: ${{ runner.temp }}/endstate-bin
      - name: Download shard evidence
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: synthetic-shard-*
          path: ${{ runner.temp }}/validation-input
          merge-multiple: true
      - name: Download catalog evidence
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: catalog-matrix
          path: ${{ runner.temp }}/validation-input
      - name: Download synthetic canary evidence
        # v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: notepad-engine-contract
          path: ${{ runner.temp }}/validation-input
      - name: Extract known-failure authority
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw 'checkout commit does not match GITHUB_SHA'
          }
          $baseAuthority = Join-Path $env:RUNNER_TEMP 'base-known-failures.json'
          $ledgerPath = '.github/validation/synthetic-known-failures.json'
          function Copy-GitBlob([string]$reference, [string]$destination) {
            $stream = [System.IO.File]::Open($destination, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo.FileName = $env:ComSpec
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            $process.StartInfo.ArgumentList.Add('/d')
            $process.StartInfo.ArgumentList.Add('/s')
            $process.StartInfo.ArgumentList.Add('/c')
            $process.StartInfo.ArgumentList.Add("git show $reference")
            try {
              if (-not $process.Start()) {
                throw 'git show did not start'
              }
              $process.StandardOutput.BaseStream.CopyTo($stream)
              $stderr = $process.StandardError.ReadToEnd()
              $process.WaitForExit()
              if ($process.ExitCode -ne 0) {
                throw "git show failed with exit code $($process.ExitCode): $stderr"
              }
            } catch {
              Remove-Item -LiteralPath $destination -Force -ErrorAction SilentlyContinue
              throw
            } finally {
              $stream.Dispose()
            }
          }
          function Extract-BaseAuthority([string]$commit) {
            $reference = "$commit`:$ledgerPath"
            git cat-file -e $reference 2>$null
            $probeExit = $LASTEXITCODE
            if ($probeExit -eq 0) {
              Copy-GitBlob $reference $baseAuthority
              return
            }
            if ($probeExit -ne 1 -and $probeExit -ne 128) {
              throw "git cat-file probe failed with exit code $probeExit"
            }
            $treeEntry = @(git ls-tree $commit -- $ledgerPath)
            if ($LASTEXITCODE -ne 0) {
              throw "git ls-tree probe failed with exit code $LASTEXITCODE"
            }
            if ($treeEntry.Count -ne 0) {
              throw 'git cat-file reported an existing base ledger as absent'
            }
            $global:LASTEXITCODE = 0
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
            $parents = ((git rev-list --parents -n 1 HEAD).Trim() -split '\s+')
            if ($parents.Count -ne 3) {
              throw 'pull request checkout must be a two-parent merge commit'
            }
            if ($parents[2].ToLowerInvariant() -ne $event.pull_request.head.sha.ToLowerInvariant()) {
              throw 'pull request merge head does not match event authority'
            }
            # pull_request.base.sha keeps the base the PR was opened on, while the
            # merge commit's first parent is the base branch tip when GitHub built
            # it. Require that parent to be on the base branch, so the ledger
            # authority still comes from a base commit and never from the PR.
            $baseRef = 'refs/remotes/origin/validation-authority-base'
            git fetch --no-tags --depth=200 origin "+refs/heads/$($event.pull_request.base.ref):$baseRef"
            if ($LASTEXITCODE -ne 0) {
              throw "git fetch of the base branch failed with exit code $LASTEXITCODE"
            }
            git merge-base --is-ancestor $parents[1] $baseRef
            if ($LASTEXITCODE -ne 0) {
              throw 'pull request merge base parent is not among the last 200 commits of the base branch'
            }
            Extract-BaseAuthority $parents[1]
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            Extract-BaseAuthority $env:GITHUB_SHA
          } else {
            throw 'unsupported validation authority event or ref'
          }
      - name: Aggregate compact evidence
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $engine = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate.exe'
          $validator = Join-Path $env:RUNNER_TEMP 'endstate-bin\endstate-validation.exe'
          $resultRoot = Join-Path $env:RUNNER_TEMP 'endstate-validation-results'
          $baseAuthority = Join-Path $env:RUNNER_TEMP 'base-known-failures.json'
          $headCandidate = Join-Path $env:GITHUB_WORKSPACE '.github\validation\synthetic-known-failures.json'
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          & $validator aggregate --engine $engine --repo $env:GITHUB_WORKSPACE --commit $env:GITHUB_SHA --input (Join-Path $env:RUNNER_TEMP 'validation-input') --base-authority $baseAuthority --head-candidate $headCandidate --result (Join-Path $resultRoot 'aggregate.json') | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'aggregate-output.json')
          exit $LASTEXITCODE
      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'aggregate-output.json')) {
            "## Verified Module Matrix (synthetic evidence)" | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'aggregate-output.json') | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "## Verified Module Matrix`nEvidence aggregation did not produce JSON." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload compact aggregate evidence
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-module-matrix-aggregate
          path: ${{ runner.temp }}/endstate-validation-results/aggregate.json
          if-no-files-found: ignore
          retention-days: 7

  test-unix:
    name: Go Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Go
        # v6.0.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: go-engine/go.sum
      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l go-engine)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: cd go-engine && go vet ./...
      - name: Test
        run: cd go-engine && go test ./...

  # Engineering-practices quality check (https://github.com/Artexis10/engineering-practices):
  # fails on Go functions a pull request adds that nothing reaches (deadcode on windows, linux, darwin)
  # and posts the Quality report. It is not a required check.
  quality:
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    # The test jobs named in .github/quality.yml, so their runtime is known.
    needs: [test, test-unix, integration-windows, synthetic-shards, catalog-matrix, notepad-engine-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout repository
        # v5.0.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        # v6.0.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: go-engine/go.sum
      - uses: Artexis10/engineering-practices@v1
